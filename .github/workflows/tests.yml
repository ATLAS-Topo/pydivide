name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # the scripts extra (psutil) so the end-to-end test of
        # scripts/run_area.py runs here instead of skipping
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,scripts]"

      - name: Show environment
        run: |
          python -c "import numpy, scipy, rasterio, geopandas, shapely, pyproj; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| rasterio', rasterio.__version__, '| geopandas', geopandas.__version__, '| shapely', shapely.__version__, '| pyproj', pyproj.__version__)"
          python -c "import pyogrio; print('gdal', pyogrio.__gdal_version_string__)"

      # The MATLAB reference exports live in the paper's Zenodo data deposit
      # (see docs/validation.md), not in this repository, so the ladder tests
      # that compare against them skip here. What CI proves is that the
      # package installs cleanly on a machine that has never seen this
      # project and that every synthetic test passes on two operating
      # systems and three Python versions.
      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: pytest tests -q -rs

  # The declared dependency floors, installed at exactly those versions:
  # a floor that is only declared is a floor nobody has tested.
  floor:
    name: dependency floors on python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install at the floors
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.0.2" "rasterio==1.3.11" "geopandas==1.0.1" "pyogrio==0.10.0" "shapely==2.0.4" "pyproj==3.6.1" "pandas==2.2.2" "matplotlib==3.9.0" "topotoolbox==0.0.12" pytest
          pip install -e . --no-deps

      - name: Show environment
        run: |
          python -c "import numpy, shapely, geopandas, pyogrio, rasterio, pyproj; print('numpy', numpy.__version__, '| shapely', shapely.__version__, '| geopandas', geopandas.__version__, '| pyogrio', pyogrio.__version__, '| rasterio', rasterio.__version__, '| pyproj', pyproj.__version__)"

      - name: Run tests
        run: pytest tests -q -rs
